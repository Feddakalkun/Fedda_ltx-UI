# nginx config for the standalone frontend container.
# Serves the React SPA and proxies API/WS calls to the backend service.
# In docker-compose the backend service is called "backend".
# Override BACKEND_HOST at build time if needed (or update here).

worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 500M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # React SPA — all unknown paths fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # FastAPI backend
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Voice WebSocket (FastAPI)
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # ComfyUI WebSocket — must be before /comfy/ catch-all
        location /comfy/ws {
            rewrite ^/comfy/(.*) /$1 break;
            proxy_pass http://backend:8199;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # ComfyUI API
        location /comfy/ {
            rewrite ^/comfy/(.*) /$1 break;
            proxy_pass http://backend:8199;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # JupyterLab
        location /jupyter/ {
            rewrite ^/jupyter/(.*) /$1 break;
            proxy_pass http://backend:8888;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
