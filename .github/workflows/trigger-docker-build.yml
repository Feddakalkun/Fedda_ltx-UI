name: Trigger Docker Build

on:
  # Disabled auto-trigger to avoid duplicate long-running builds.
  # Use manual dispatch only if you still need to trigger external docker repo.
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Docker repo rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DOCKER_REPO_PAT }}" \
            https://api.github.com/repos/Feddakalkun/comfyuifeddafront-docker/dispatches \
            -d '{"event_type":"main_repo_updated"}'
