# ============================================================================
# FEDDA AI Studio — Build & push RunPod Docker image to ghcr.io
#
# Triggers on every push to main that touches relevant files.
# The built image can be used directly in RunPod as:
#   ghcr.io/feddakalkun/fedda-hub-v3:latest
#
# Note: first build takes ~40-60 min (CUDA + PyTorch layers).
#       Subsequent builds use layer cache and are much faster.
# ============================================================================

name: Build & Push RunPod Image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'runpod/**'
      - 'scripts/**'
      - 'config/**'
      - 'assets/**'
      - '.github/workflows/docker-runpod.yml'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fedda-hub-v3

jobs:
  build-and-push:
    name: Build RunPod image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GitHub Actions cache to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
